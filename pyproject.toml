[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sim2real"
version = "0.1.0"
description = "Portable agentic sim2real framework with embodiment-scoped robot examples."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
dependencies = []

[project.scripts]
agentic-sim2real = "agentic_sim2real.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_sim2real*"]
