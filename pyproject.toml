[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ur-gear-agentic"
version = "0.1.0"
description = "Agentic sim2real helper for the Isaac Lab UR10e gear assembly tutorial."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Codex" }]
dependencies = []

[project.scripts]
ur-gear-agentic = "ur_agentic.cli:main"

[tool.setuptools.packages.find]
include = ["ur_agentic*"]
