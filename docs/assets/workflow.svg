<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Sim2Real Workflow</title>
  <desc id="desc">Color workflow diagram showing real logs and uploaded videos flowing through camera tuning, friction matching, evidence gates, SysID, agentic tuning, regression, release review, customer hub, developer harness, and human gated robot execution.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 12px Arial, sans-serif; fill: #334155; }
      .input { fill: #e0f2fe; stroke: #0284c7; }
      .evidence { fill: #dcfce7; stroke: #16a34a; }
      .agent { fill: #fef3c7; stroke: #d97706; }
      .gate { fill: #fee2e2; stroke: #dc2626; }
      .review { fill: #f3e8ff; stroke: #9333ea; }
      .robot { fill: #f8fafc; stroke: #475569; stroke-dasharray: 7 5; }
      .node { stroke-width: 2.5; rx: 12; }
      .arrow-blue { stroke: #0284c7; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .arrow-amber { stroke: #d97706; stroke-width: 2.5; fill: none; marker-end: url(#arrow-amber); }
      .arrow-red { stroke: #dc2626; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 8 6; }
      .label { font: 700 11px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="650"/>
  <text class="title" x="42" y="52">Agentic Sim2Real Customer Upload Workflow</text>
  <text class="subtitle" x="42" y="78">Uploaded real videos are first-class evidence for camera parameters and object/gripper friction before release review.</text>

  <rect class="node input" x="42" y="132" width="165" height="78"/>
  <text class="node-title" x="62" y="162">Real Robot Logs</text>
  <text class="node-body" x="62" y="184">actions, joints, pose,</text>
  <text class="node-body" x="62" y="200">contact, labels</text>

  <rect class="node input" x="42" y="282" width="165" height="88"/>
  <text class="node-title" x="62" y="312">Uploaded Videos</text>
  <text class="node-body" x="62" y="334">RGB/depth rollout,</text>
  <text class="node-body" x="62" y="350">calibration, contact</text>

  <rect class="node evidence" x="260" y="250" width="178" height="88"/>
  <text class="node-title" x="282" y="280">Video Camera</text>
  <text class="node-title" x="282" y="298">Parameter Tuning</text>
  <text class="node-body" x="282" y="320">intrinsics, extrinsics,</text>
  <text class="node-body" x="282" y="336">latency, reprojection</text>

  <rect class="node evidence" x="260" y="378" width="178" height="88"/>
  <text class="node-title" x="282" y="408">Video Contact</text>
  <text class="node-title" x="282" y="426">Friction Matching</text>
  <text class="node-body" x="282" y="448">object slip, gripper pads,</text>
  <text class="node-body" x="282" y="464">stick-slip events</text>

  <rect class="node evidence" x="492" y="168" width="178" height="88"/>
  <text class="node-title" x="514" y="198">Real Data</text>
  <text class="node-title" x="514" y="216">Evidence Gate</text>
  <text class="node-body" x="514" y="238">alignment, provenance,</text>
  <text class="node-body" x="514" y="254">pose repeatability</text>

  <rect class="node evidence" x="492" y="330" width="178" height="88"/>
  <text class="node-title" x="514" y="360">Trajectory + Physics</text>
  <text class="node-title" x="514" y="378">SysID</text>
  <text class="node-body" x="514" y="400">delay, stiction, contact,</text>
  <text class="node-body" x="514" y="416">Newton/PACE optional</text>

  <rect class="node agent" x="724" y="330" width="178" height="88"/>
  <text class="node-title" x="746" y="360">Agentic Tuning</text>
  <text class="node-title" x="746" y="378">Plan</text>
  <text class="node-body" x="746" y="400">bounded camera, friction,</text>
  <text class="node-body" x="746" y="416">DR, action candidates</text>

  <rect class="node evidence" x="724" y="168" width="178" height="88"/>
  <text class="node-title" x="746" y="198">Regression</text>
  <text class="node-title" x="746" y="216">Evaluation</text>
  <text class="node-body" x="746" y="238">sim rollout, scorecards,</text>
  <text class="node-body" x="746" y="254">critic challenges</text>

  <rect class="node gate" x="956" y="168" width="178" height="88"/>
  <text class="node-title" x="978" y="198">Release Candidate</text>
  <text class="node-title" x="978" y="216">Gate</text>
  <text class="node-body" x="978" y="238">blocks missing evidence,</text>
  <text class="node-body" x="978" y="254">promotes to review only</text>

  <rect class="node review" x="492" y="500" width="178" height="88"/>
  <text class="node-title" x="514" y="530">Customer Hub</text>
  <text class="node-body" x="514" y="552">readiness, blockers,</text>
  <text class="node-body" x="514" y="568">next action</text>

  <rect class="node review" x="724" y="500" width="178" height="88"/>
  <text class="node-title" x="746" y="530">Developer Harness</text>
  <text class="node-body" x="746" y="552">subchecks, scores,</text>
  <text class="node-body" x="746" y="568">LLM journal, artifacts</text>

  <rect class="node gate" x="956" y="330" width="178" height="88"/>
  <text class="node-title" x="978" y="360">Human-Gated</text>
  <text class="node-title" x="978" y="378">Robot Review</text>
  <text class="node-body" x="978" y="400">explicit approval,</text>
  <text class="node-body" x="978" y="416">supervised only</text>

  <rect class="node robot" x="956" y="500" width="178" height="72"/>
  <text class="node-title" x="978" y="530">Real Robot</text>
  <text class="node-body" x="978" y="552">safe_to_autorun_robot</text>
  <text class="node-body" x="978" y="568">stays false</text>

  <path class="arrow-blue" d="M207 171 C300 171 386 190 492 204"/>
  <path class="arrow-blue" d="M207 326 C225 326 238 310 260 300"/>
  <path class="arrow-blue" d="M207 326 C230 350 237 400 260 422"/>
  <path class="arrow-green" d="M438 294 C462 270 468 232 492 216"/>
  <path class="arrow-green" d="M438 422 C462 410 468 388 492 374"/>
  <path class="arrow-green" d="M670 212 L724 212"/>
  <path class="arrow-green" d="M670 374 L724 374"/>
  <path class="arrow-amber" d="M813 330 L813 256"/>
  <path class="arrow-green" d="M902 212 L956 212"/>
  <path class="arrow-red" d="M1045 256 L1045 330"/>
  <path class="arrow-red dash" d="M1045 418 L1045 500"/>

  <path class="arrow-green dash" d="M580 256 L580 500"/>
  <path class="arrow-green dash" d="M580 418 C610 470 665 515 724 536"/>
  <path class="arrow-amber dash" d="M813 418 L813 500"/>

  <text class="label" x="1014" y="461">never automatic</text>
  <text class="label" x="42" y="616">Blue: user evidence</text>
  <text class="label" x="190" y="616">Green: deterministic validation</text>
  <text class="label" x="405" y="616">Amber: bounded agent proposals</text>
  <text class="label" x="645" y="616">Red: release and human safety gates</text>
  <text class="label" x="900" y="616">Purple: review surfaces</text>
</svg>
