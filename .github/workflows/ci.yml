name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile ur_agentic/*.py tests/test_pipeline.py
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests
      - name: Prepare real-data example
        run: PYTHONPATH=. python -m ur_agentic.cli --config configs/ur10e_gear_assembly.example.json prepare-real-data --session real_data/example_session --out /tmp/ur_real_records.jsonl
      - name: Skill manifest validation
        run: PYTHONPATH=. python -m ur_agentic.cli --config configs/ur10e_gear_assembly.example.json validate-skills --root .
      - name: Skill harness golden run
        run: PYTHONPATH=. python -m ur_agentic.cli --config configs/ur10e_gear_assembly.example.json run-harness --root . --dataset sample_data/real_log_demo.jsonl --out /tmp/ur_gear_harness
      - name: Evaluation loop golden run
        run: PYTHONPATH=. python -m ur_agentic.cli --config configs/ur10e_gear_assembly.example.json run-evaluation-loop --root . --dataset sample_data/real_log_demo.jsonl --out /tmp/ur_gear_eval
      - name: Shell syntax
        run: bash -n scripts/*.sh
