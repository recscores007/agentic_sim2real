name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile ur_agentic/*.py tests/test_pipeline.py
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests
      - name: Shell syntax
        run: bash -n scripts/*.sh
